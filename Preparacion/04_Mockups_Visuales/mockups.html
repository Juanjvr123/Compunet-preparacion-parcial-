<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockups visuales de parciales</title>
    <style>
      body {
        margin: 0;
        background: #eef2f6;
        color: #172b4d;
        font-family: Arial, sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 28px;
        color: #5e6c84;
      }

      section {
        margin-bottom: 32px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mockups visuales para parciales React</h1>
      <p>Referencias rapidas para construir dashboards, formularios, tablas CRUD y pantallas protegidas.</p>

      <section>
        <h2>Actividad fisica</h2>
        <img src="./mockup_actividad_fisica.svg" alt="Mockup actividad fisica" />
      </section>

      <section>
        <h2>Biblioteca CRUD</h2>
        <img src="./mockup_biblioteca.svg" alt="Mockup biblioteca" />
      </section>

      <section>
        <h2>Eventos y espacios</h2>
        <img src="./mockup_eventos.svg" alt="Mockup eventos" />
      </section>

      <section>
        <h2>Tickets</h2>
        <img src="./mockup_tickets.svg" alt="Mockup tickets" />
      </section>

      <section>
        <h2>Parcial proyectos Survey API</h2>
        <img src="./mockup_parcial_g3_proyectos.svg" alt="Mockup parcial proyectos" />
      </section>
    </main>
  </body>
</html>
